<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de notas</title>
    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 400px;
            border-collapse: collapse;
            padding: 10px
        }
        thead {
            border: 1px solid black;
            border-collapse: collapse;
            background-color: lightgray;
        }
        thead th {
            border-collapse: collapse;
            padding: 10px;
        }
        th {
            border: 1px solid black
        }
        td {
            border: 1px solid black
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <th>Áreas</th>
            <th>Disciplinas</th>
            <th>Notas</th>
            <th>Notas 1</th>
            <th>Notas 2</th>
            <th>Média</th>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4">Exatas</th>
            </tr>
        </tbody>
    </table>
</body>
</html>
