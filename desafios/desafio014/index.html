<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de notas</title>
    <style>

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 400px;
            height: 300px;
            border-collapse: collapse;
            padding: 10px
        }
        thead {
            border: 1px solid black;
            border-collapse: collapse;
            background-color: gray;
            color: white;
        }

        thead tr { 
            border: 1px solid black;
            border-collapse: collapse;
            background-color: gray;
            color: white;
        }
        thead th {
            border-collapse: collapse;
            padding: 10px;
        }
        td.materia {
            text-align: left;
            padding: 10px;
        }
        th.media {
            border: 1px solid black;
            border-collapse: collapse;
            text-align: left;
            padding: 10px;
            background-color: gray;
            color: white;
        }
        td.nota {
            background-color: gray;
            color: white;
            font-weight: bold;
        }
        th {
            border: 1px solid black
        }
        td {
            border: 1px solid black;
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <th rowspan="2" scope="rcol">Áreas</th>
            <th rowspan="2" scope="col">Disciplinas</th>
            <th colspan="2" scope="colgroup">Notas</th>
            <th rowspan="2" scope="col">Média</th>
            <tr>
               <th>Nota 1</th>
               <th>Nota 2</th>
           </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup">Exatas</th>
                <td class="materia">Matemática</td>
                <td>00</td>
                <td>00</td>
                <td>00</td>
            </tr>
            <tr>
                <td class="materia">Física</td>
                <td>00</td>
                <td>00</td>
                <td>00</td>
                
            </tr>
            <tr>
                <td class="materia">Química</td>
                <td>00</td>
                <td>00</td>
                <td>00</td>
            </tr>
            <tr>
                <td class="materia">Biologia</td>
                <td>00</td>
                <td>00</td>
                <td>00</td>
            </tr>

            <th colspan="4" class="media" scope="row">Média de Exatas</th>
            <td class="nota">00</td>

            <tr>
                <th rowspan="2" scope="row">Humanas</th>
                <td class="materia">História</td>
                <td>00</td>
                <td>00</td>
                <td>00</td>
            </tr>

            <tr>
               <td class="materia">Geografia</td>
               <td>00</td>
               <td>00</td>
               <td>00</td>
            </tr>
            <th colspan="4" class="media" scope="colgroup">Média de Humanas</th>
            <td class="nota">00</td>
        </tbody>
    </table>
</body>
</html>
