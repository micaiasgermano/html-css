<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de caixas</title>
    <style>
        h1{ /*Box-level*/
            background-color: lightgray;
            height: 300px;
            width: 300px;

            border: 10px solid rgb(0, 43, 124);

            padding: 10px;

            margin: 20px auto 40px auto;   

            outline: 5px dashed solid rgb(0, 73, 209);

            
        }
        a{ /*Inline-level*/
            background-color: lightgray;
            height: 300px;
            width: 300px;
            border: 5px solid rgb(0, 43, 124);
        }
        p{
            font-size: 14px;

        }
    </style>
</head>
<body>
    <h1>Exemplos de caixas box-level</h1>
    <p>Parágrafos também são exemplos de caixas box-level, mas os <a target="_blank" href="https://www.example.com">links são exemplos de caixas inline</a>.Vamos ver como isso funciona.</p>
</body>
</html>
